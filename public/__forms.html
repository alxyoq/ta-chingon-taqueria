<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ta Chingón form definitions</title>
  </head>
  <body>
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="subject" type="text" />
      <textarea name="message"></textarea>
    </form>

    <form
      name="catering"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="catering" />
      <input name="bot-field" />
      <input name="name" type="text" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <input name="event-date" type="date" />
      <input name="guest-count" type="number" />
      <input name="event-location" type="text" />
      <textarea name="event-details"></textarea>
    </form>
  </body>
</html>
